<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ascolto em Família</title>
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1c1b19;--mut:#6b6760;--line:#e6e2d9;--acc:#0f766e;--acc-ink:#fff;--acc2:#c2410c;--ok:#15803d;--bad:#b91c1c;--warn:#a16207;--chip:#e7f3f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--card:#1e1d1a;--ink:#f1efe9;--mut:#a39e94;--line:#2f2d29;--acc:#2dd4bf;--acc-ink:#062e2a;--acc2:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#facc15;--chip:#1c2e2a}}
:root[data-theme="dark"]{--bg:#141412;--card:#1e1d1a;--ink:#f1efe9;--mut:#a39e94;--line:#2f2d29;--acc:#2dd4bf;--acc-ink:#062e2a;--acc2:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#facc15;--chip:#1c2e2a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:-.01em}
header h1 span{color:var(--acc)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
header select{width:auto}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;cursor:pointer}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px}
.mut{color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--acc-ink);width:100%}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--acc)}
.stat span{font-size:12px;color:var(--mut)}
.chip{display:inline-block;background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;margin:0 6px 6px 0}
.lvl{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid currentColor}
.l1{color:var(--ok)}.l2{color:var(--acc)}.l3{color:var(--warn)}.l4{color:var(--acc2)}
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.wk .n{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--acc);flex:none}
.wk .t{flex:1;min-width:0}
.wk .t div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a{flex:1;min-width:90px;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink);font-size:14px;font-weight:600}
.day{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.day:first-of-type{border-top:0}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;margin-top:2px}
.day.done .box{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.day.done .txt{color:var(--mut);text-decoration:line-through}
.vc{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.vc:first-of-type{border-top:0}
.vc .it{font-weight:600}
.spk{background:var(--chip);border:0;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:15px;flex:none}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flash .front{font-size:28px;font-weight:700;letter-spacing:-.01em}
.flash .back{font-size:20px;color:var(--acc)}
.flash .ex{font-size:15px;color:var(--mut);font-style:italic}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.grades button small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.g0{border-color:var(--bad)!important;color:var(--bad)!important}
.g3{border-color:var(--ok)!important;color:var(--ok)!important}
.lesson p{margin:0 0 8px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--acc)}
label{font-size:14px;color:var(--mut);display:block;margin:8px 0 4px}
.del{background:none;border:0;color:var(--bad);cursor:pointer;font-size:14px}
a{color:var(--acc)}
.langcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;font:inherit;color:inherit;cursor:pointer}
.langcard .flag{font-size:40px;line-height:1}
.langcard .t{flex:1;display:flex;flex-direction:column}
.langcard .t b{font-size:20px}
.langcard .go{font-size:28px;color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Ascolto <span>em Família</span></h1>
  <button class="spk" id="langBtn" onclick="go('lang')" aria-label="Trocar idioma">🌍</button>
  <select id="who" aria-label="Perfil"></select>
  <button class="spk" onclick="go('settings')" aria-label="Configurações">⚙️</button>
</header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
/* ===================== CURSOS ===================== */
const COURSES={
it:{name:"Italiano",flag:"🇮🇹",lang:"it",hello:"Ciao",lyr:"testo",
 test:"Ciao! Come stai? Oggi studiamo italiano insieme.",
 day6:"Ci vogliono tre uova → Ci vogliono due ore",
 weeks:[
{n:1,section:"Módulo 1 · Clássicos",title:"Ci vuole un fiore",artist:"Sergio Endrigo",year:1974,level:"Iniciante",lv:1,
theme:"Ci vuole / ci vogliono (é preciso)",
about:"Canção infantil clássica, em forma de corrente: cada coisa depende de outra, até chegar numa flor. Melodia lenta e dicção limpíssima.",
why:"Parece simples demais, e é de propósito: ritmo lento e repetição pura para a primeira semana. A estrutura fixa uma construção que os italianos usam o dia inteiro.",
hunt:["fiore","albero","seme","frutto","terra","legno","tavolo","monte"],
lesson:"<p><b>Ci vuole</b> + singular e <b>ci vogliono</b> + plural significam <i>é preciso / precisa de</i>.</p><p>Também serve para tempo: <b>Ci vogliono due ore</b> = leva duas horas.</p><p>Repare como a música encadeia: <i>per fare X ci vuole Y</i>. Tente criar a sua própria corrente em português e depois em italiano.</p>",
cards:[
["ci vuole","é preciso / precisa de (singular)","Ci vuole pazienza con i bambini.","É preciso paciência com as crianças."],
["ci vogliono","são precisos (plural)","Ci vogliono tre uova per la torta.","São precisos três ovos para o bolo."],
["Quanto ci vuole?","Quanto tempo leva?","Quanto ci vuole per arrivare a Roma?","Quanto tempo leva para chegar a Roma?"],
["per fare","para fazer","Per fare il caffè ci vuole l'acqua calda.","Para fazer café precisa de água quente."],
["il fiore / i fiori","a flor / as flores","Ho comprato dei fiori per la mamma.","Comprei flores para a mamãe."],
["l'albero","a árvore","C'è un albero grande nel giardino.","Há uma árvore grande no jardim."],
["il seme","a semente","Il seme diventa una pianta.","A semente vira uma planta."],
["la frutta / il frutto","a fruta (em geral) / o fruto","Mangio frutta ogni mattina.","Como fruta toda manhã."],
["la terra","a terra","Ho le mani sporche di terra.","Estou com as mãos sujas de terra."],
["il legno","a madeira","Questa sedia è di legno.","Esta cadeira é de madeira."],
["il tavolo","a mesa","La cena è sul tavolo.","O jantar está na mesa."]]},

{n:2,title:"Azzurro",artist:"Adriano Celentano",year:1968,level:"Iniciante",lv:1,
theme:"Tédio de verão, desejos e o verbo sembrare",
about:"Escrita por Paolo Conte, fala de uma tarde de verão vazia, longe de quem se ama, e de uma vontade de fugir. Virou quase um segundo hino da Itália.",
why:"Ritmo de marchinha, voz bem articulada e vocabulário do cotidiano. Você vai ouvir essa música em todo estádio e festa italiana.",
hunt:["azzurro","pomeriggio","estate","treno","desideri"],
lesson:"<p><b>Troppo</b> = demais: <i>troppo caldo, troppo lungo</i>.</p><p><b>Mi sembra</b> = me parece. Funciona com pronome antes: <i>ti sembra, gli sembra</i>.</p><p>Cores concordam em gênero e número: <i>cielo azzurro, macchina azzurra, occhi azzurri</i>.</p>",
cards:[
["azzurro","azul-claro (a cor da seleção)","Il cielo oggi è azzurro.","O céu hoje está azul-claro."],
["il pomeriggio","a tarde","Ci vediamo domani pomeriggio.","Nos vemos amanhã à tarde."],
["l'estate","o verão","D'estate andiamo al mare.","No verão vamos à praia."],
["troppo","demais","Fa troppo caldo oggi.","Está calor demais hoje."],
["cercare","procurar","Sto cercando le chiavi.","Estou procurando as chaves."],
["trovare","encontrar","Non trovo il telefono.","Não encontro o telefone."],
["il treno","o trem","Il treno parte alle otto.","O trem parte às oito."],
["il desiderio","o desejo","Esprimi un desiderio!","Faça um pedido!"],
["annoiarsi","entediar-se","Mi annoio senza di te.","Fico entediado sem você."],
["da solo / da sola","sozinho / sozinha","Oggi pranzo da solo.","Hoje almoço sozinho."],
["mi sembra","me parece","Mi sembra una buona idea.","Me parece uma boa ideia."]]},

{n:3,title:"Il mondo",artist:"Jimmy Fontana",year:1965,level:"Iniciante",lv:1,
theme:"Passato prossimo e non... mai",
about:"Depois de uma noite de amor que acabou, o narrador percebe que o mundo continua girando como sempre, indiferente à dor dele.",
why:"Frases longas e cantadas devagar, perfeitas para perceber o passato prossimo (o tempo passado mais usado na fala).",
hunt:["mondo","notte","giorno","girare"],
lesson:"<p><b>Passato prossimo</b> = <i>avere/essere</i> + particípio: <b>ho fatto</b> (fiz), <b>sono andato</b> (fui).</p><p>Verbos de movimento e reflexivos usam <b>essere</b>, e o particípio concorda: <i>sono andata, ci siamo fermati</i>.</p><p><b>Non... mai</b> = nunca: <i>non ho mai visto</i>.</p>",
cards:[
["il mondo","o mundo","Voglio girare il mondo.","Quero rodar o mundo."],
["girare","girar / rodar / virar","Gira a destra al semaforo.","Vire à direita no semáforo."],
["fermarsi","parar","Mi sono fermato a prendere un caffè.","Parei para tomar um café."],
["non... mai","nunca","Non sono mai stato in Sicilia.","Nunca estive na Sicília."],
["sempre","sempre","Arrivi sempre in ritardo!","Você sempre chega atrasado!"],
["ancora","ainda / de novo","Sei ancora qui?","Você ainda está aqui?"],
["la notte","a noite (madrugada)","Ho dormito male stanotte.","Dormi mal esta noite."],
["il giorno","o dia","Ogni giorno è diverso.","Cada dia é diferente."],
["ho fatto","eu fiz (com avere)","Ieri ho fatto una torta.","Ontem fiz um bolo."],
["sono andato/a","eu fui (com essere)","Sabato sono andata al cinema.","Sábado fui ao cinema."]]},

{n:4,title:"La solitudine",artist:"Laura Pausini",year:1993,level:"Básico",lv:2,
theme:"Saudade e partida: mancare, andarsene, non... più",
about:"Uma adolescente sofre porque o namorado da escola, Marco, foi embora para longe. A música que lançou Laura Pausini no mundo.",
why:"Dicção muito clara e vocabulário de sentimentos que você usa todo dia. Laura também gravou em espanhol, o que ajuda a comparar.",
hunt:["solitudine","Marco","tornare","banco"],
lesson:"<p><b>Mancare</b> funciona ao contrário do português: <b>mi manchi</b> = você me faz falta (sinto sua falta). <b>Mi manca il Brasile</b> = sinto falta do Brasil.</p><p><b>Andarsene</b> = ir embora: <i>me ne vado, se n'è andato</i>.</p><p><b>Non... più</b> = não... mais.</p>",
cards:[
["la solitudine","a solidão","La solitudine a volte fa bene.","A solidão às vezes faz bem."],
["mi manchi","sinto sua falta","Mi manchi tanto, torna presto!","Sinto muito sua falta, volte logo!"],
["mi manca...","sinto falta de...","Mi manca il Brasile.","Sinto falta do Brasil."],
["me ne vado","vou embora","Me ne vado, è tardi.","Vou embora, está tarde."],
["se n'è andato/a","ele/ela foi embora","Lucia se n'è andata senza salutare.","Lucia foi embora sem se despedir."],
["tornare","voltar","Quando torni a casa?","Quando você volta para casa?"],
["non... più","não... mais","Non ci vado più.","Não vou mais lá."],
["lontano","longe","Il Giappone è lontano dall'Italia.","O Japão é longe da Itália."],
["il ricordo","a lembrança","Ho un bel ricordo di quel viaggio.","Tenho uma boa lembrança daquela viagem."],
["dimenticare","esquecer","Non dimenticare l'ombrello!","Não esqueça o guarda-chuva!"],
["compagni di banco","colegas de carteira (escola)","Eravamo compagni di banco.","Sentávamos juntos na escola."]]},

{n:5,title:"Parole parole",artist:"Mina e Alberto Lupo",year:1972,level:"Básico",lv:2,
theme:"O pronome ne e expressões de diálogo",
about:"Um duelo: ele declama elogios românticos falando, ela responde cantando que aquilo tudo é só conversa fiada.",
why:"Metade da música é fala, não canto: você treina o italiano falado de verdade, lento e teatral. Divertido para ouvir em casal.",
hunt:["parole","soltanto","caramelle"],
lesson:"<p><b>Ne</b> substitui uma quantidade ou um assunto: <i>Quanti figli hai? <b>Ne</b> ho due</i> (tenho dois [deles]).</p><p>Expressões fixas: <b>non ne posso più</b> (não aguento mais), <b>non ne voglio</b> (não quero disso).</p><p>No imperativo o pronome gruda no verbo: <b>ascoltami</b>, <b>dimmi</b>, <b>guardami</b>.</p>",
cards:[
["le parole","as palavras","Sono solo parole.","São só palavras."],
["soltanto","somente","Ho soltanto cinque minuti.","Tenho só cinco minutos."],
["ne","disso / deles (quantidade)","Quanti figli hai? Ne ho due.","Quantos filhos você tem? Tenho dois."],
["non ne voglio più","não quero mais (disso)","Grazie, ma non ne voglio più.","Obrigado, mas não quero mais."],
["non ne posso più","não aguento mais","Che caldo, non ne posso più!","Que calor, não aguento mais!"],
["la caramella","a bala (doce)","Vuoi una caramella?","Quer uma bala?"],
["ascoltami","me escuta","Ascoltami un attimo, per favore.","Me escuta um instante, por favor."],
["ti prego","por favor (te peço)","Ti prego, non arrabbiarti.","Por favor, não fique bravo."],
["Ma dai!","Fala sério! / Não acredito!","Ma dai, davvero?","Fala sério, é verdade?"],
["Basta!","Chega!","Basta, ho capito!","Chega, entendi!"],
["ogni tanto","de vez em quando","Ogni tanto ci sentiamo.","De vez em quando a gente se fala."]]},

{n:6,title:"Volare (Nel blu dipinto di blu)",artist:"Domenico Modugno",year:1958,level:"Básico",lv:2,
theme:"Sonhos e o imperfetto",
about:"O narrador sonha que pinta o rosto de azul e sai voando pelo céu infinito, cantando de felicidade, até acordar.",
why:"O refrão é conhecido no mundo inteiro e as estrofes usam o imperfetto, o tempo para descrever sonhos e lembranças.",
hunt:["volare","cantare","blu","dipinto","sogno","cielo","felice"],
lesson:"<p><b>Imperfetto</b> descreve como as coisas eram ou estavam: <b>ero</b> (eu era/estava), <b>avevo</b> (eu tinha), <b>sognavo</b> (eu sonhava).</p><p>Regra prática: <i>passato prossimo</i> conta o que aconteceu; <i>imperfetto</i> pinta o cenário. <i>Ero a casa quando <b>hai chiamato</b>.</i></p>",
cards:[
["volare","voar","Ho paura di volare.","Tenho medo de voar."],
["il sogno","o sonho","Il mio sogno è vivere a Roma.","Meu sonho é morar em Roma."],
["sognare","sonhar","Stanotte ho sognato la nonna.","Esta noite sonhei com a vovó."],
["il cielo","o céu","Guarda le stelle in cielo!","Olha as estrelas no céu!"],
["felice","feliz","Sono felice di vederti.","Fico feliz em te ver."],
["dipinto","pintado","Il muro è dipinto di blu.","A parede está pintada de azul."],
["cantare","cantar","Mia figlia canta sempre in macchina.","Minha filha sempre canta no carro."],
["ero","eu era / estava","Quando ero piccolo vivevo a San Paolo.","Quando eu era pequeno morava em São Paulo."],
["avevo","eu tinha","Avevo un cane bianco.","Eu tinha um cachorro branco."],
["lassù","lá em cima","Che vista da lassù!","Que vista lá de cima!"]]},

{n:7,title:"Una storia importante",artist:"Eros Ramazzotti",year:1985,level:"Intermediário",lv:3,
theme:"Relacionamentos e sentimentos",
about:"Um jovem fala de um amor que marcou sua vida e de como crescer muda a forma de enxergar as coisas.",
why:"Eros canta rápido em alguns trechos e arrasta vogais em outros: ótimo para treinar o ouvido para o italiano falado com emoção.",
hunt:["storia","importante"],
lesson:"<p><b>Storia</b> também significa relacionamento: <i>hanno una storia</i> = estão juntos.</p><p><b>Ci tengo</b> = eu me importo / faço questão. <b>Vale la pena</b> = vale a pena. <b>Fare finta</b> = fingir.</p>",
cards:[
["una storia","uma história / um relacionamento","Hanno una storia da due anni.","Estão juntos há dois anos."],
["importante","importante","Per me è importante.","Para mim é importante."],
["ci tengo","me importo / faço questão","Ci tengo molto a questa amicizia.","Me importo muito com essa amizade."],
["vale la pena","vale a pena","Vale la pena provare.","Vale a pena tentar."],
["fare finta","fingir","Fa finta di dormire.","Finge que está dormindo."],
["insieme","juntos","Ceniamo insieme stasera?","Jantamos juntos hoje?"],
["capire","entender","Non ho capito, puoi ripetere?","Não entendi, pode repetir?"],
["crescere","crescer","Come sei cresciuta!","Como você cresceu!"],
["Mi dispiace","Sinto muito","Mi dispiace, non volevo.","Desculpa, não foi por querer."],
["la vita","a vida","La vita è bella.","A vida é bela."],
["tra noi","entre nós","Resta tra noi, va bene?","Fica entre nós, tá?"]]},

{n:8,title:"Sere nere",artist:"Tiziano Ferro",year:2003,level:"Intermediário",lv:3,
theme:"Término e seguir em frente",
about:"Depois do fim de um relacionamento, as noites ficam escuras e a memória da outra pessoa não vai embora.",
why:"Pronúncia moderna e natural, de um cantor que hoje é referência. Muito vocabulário de emoções do dia a dia.",
hunt:["sere","nere","pensi"],
lesson:"<p><b>Ce la faccio / non ce la faccio</b> = consigo / não consigo (dar conta). Uma das expressões mais italianas que existem.</p><p><b>Mi fa male</b> = me dói: <i>mi fa male la testa</i>. Para várias partes: <i>mi fanno male i piedi</i>.</p>",
cards:[
["la sera / stasera","a noite (início) / hoje à noite","Che fai stasera?","O que vai fazer hoje à noite?"],
["nero / nera","preto(a), escuro(a)","Ho un gatto nero.","Tenho um gato preto."],
["ti penso","penso em você","Ti penso ogni giorno.","Penso em você todo dia."],
["ricordarsi","lembrar-se","Ti ricordi di me?","Você se lembra de mim?"],
["mi fa male","me dói / me machuca","Mi fa male la testa.","Estou com dor de cabeça."],
["non ce la faccio","não consigo / não dou conta","Non ce la faccio a finire oggi.","Não consigo terminar hoje."],
["andare avanti","seguir em frente","Bisogna andare avanti.","É preciso seguir em frente."],
["lasciare","deixar / terminar com","Mi ha lasciato dopo tre anni.","Terminou comigo depois de três anos."],
["il cuore","o coração","Te lo dico col cuore.","Te digo de coração."],
["piangere","chorar","Non piangere, va tutto bene.","Não chore, está tudo bem."]]},

{n:9,title:"Penso positivo",artist:"Jovanotti",year:1994,level:"Avançado",lv:4,
theme:"Otimismo e expressões de ânimo",
about:"Um manifesto acelerado de energia e otimismo: estar vivo, acreditar e seguir apesar de tudo.",
why:"É praticamente rap: rápido e cheio de palavras. Semana de desafio. Não tente entender tudo, foque no refrão e nas palavras que voltam.",
hunt:["penso","positivo","vivo"],
lesson:"<p><b>Perché</b> é ao mesmo tempo <i>por quê</i> e <i>porque</i>.</p><p><b>Magari!</b> = quem dera! (também pode ser <i>talvez</i>).</p><p><b>Dai!</b> e <b>Forza!</b> são o nosso <i>vai! / bora!</i>.</p>",
cards:[
["penso positivo","penso positivo","Oggi penso positivo!","Hoje penso positivo!"],
["perché","por quê / porque","Perché ridi? Perché sono felice.","Por que você ri? Porque estou feliz."],
["mi sento vivo","me sinto vivo","Dopo il caffè mi sento vivo.","Depois do café me sinto vivo."],
["credere","acreditar","Credo in te.","Acredito em você."],
["Forza!","Vamos! / Força!","Forza, manca poco!","Vamos, falta pouco!"],
["Dai!","Vai! / Anda!","Dai, andiamo!","Anda, vamos!"],
["Magari!","Quem dera! / talvez","Vieni in Italia? Magari!","Vem para a Itália? Quem dera!"],
["ce la faccio","eu consigo","Tranquillo, ce la faccio da solo.","Tranquilo, consigo sozinho."],
["tutto bene","tudo bem","Tutto bene a casa?","Tudo bem em casa?"],
["la gente","as pessoas","C'è tanta gente in piazza.","Tem muita gente na praça."]]},

{n:10,title:"Caruso",artist:"Lucio Dalla",year:1986,level:"Avançado",lv:4,
theme:"Carinho, o mar e um toque de napolitano",
about:"Inspirada nos últimos dias do tenor Enrico Caruso, num terraço em frente ao golfo de Sorrento, cantando para uma jovem.",
why:"Uma das canções italianas mais belas e regravadas. O refrão tem napolitano, o que treina o ouvido para variações regionais.",
hunt:["Sorrento","mare","notte","occhi","voce"],
lesson:"<p><b>Ti voglio bene</b> = te amo/te quero bem (pais, filhos, amigos). <b>Ti amo</b> = amor romântico. Para sua filha: <i>ti voglio bene</i>!</p><p>No napolitano, muitas vogais finais somem ou viram um som neutro. No refrão você vai ouvir a versão napolitana de <i>ti voglio bene</i>.</p>",
cards:[
["ti voglio bene","te amo (família/amigos)","Ti voglio bene, papà.","Te amo, papai."],
["ti amo","te amo (romântico)","Ti amo più di ieri.","Te amo mais que ontem."],
["il mare","o mar","Andiamo al mare domenica?","Vamos à praia domingo?"],
["la voce","a voz","Hai una bella voce.","Você tem uma voz bonita."],
["gli occhi","os olhos","Ha gli occhi verdi.","Tem olhos verdes."],
["guardare","olhar / assistir","Guardiamo un film?","Vamos ver um filme?"],
["stringere","apertar / abraçar forte","Stringimi forte.","Me abraça forte."],
["la terrazza","o terraço","Ceniamo in terrazza.","Jantamos no terraço."],
["il golfo","o golfo","Il golfo di Napoli è bellissimo.","O golfo de Nápoles é lindíssimo."],
["Che bello!","Que lindo! / Que bom!","Che bello rivederti!","Que bom te rever!"]]},
{n:11,section:"Módulo 2 · Itália de hoje",title:"A te",artist:"Jovanotti",year:2008,level:"Intermediário",lv:3,
theme:"Pronomes tônicos (a te, con te, per te) e o relativo che",
about:"Uma declaração de amor em forma de lista: verso após verso, ele dedica a música à mulher que mudou a vida dele, enumerando tudo o que ela é.",
why:"Depois do Penso positivo, o Jovanotti lento e romântico. A estrutura em lista se repete o tempo todo, perfeita para fixar 'a te che...' e voltar ao estilo dele com calma.",
hunt:["a te","che","sei"],
lesson:"<p>Depois de preposição, o pronome muda: <b>a te</b>, <b>con te</b>, <b>per te</b>, <b>senza di te</b>, <b>con me</b>.</p><p><b>che</b> = que / quem (relativo): <i>la donna <b>che</b> amo</i>, <i>il libro <b>che</b> leggo</i>.</p>",
cards:[
["a te","a você / para você","Questa canzone è dedicata a te.","Esta música é dedicada a você."],
["con te","com você","Voglio stare con te.","Quero ficar com você."],
["per te","por você / para você","Ho cucinato per te.","Cozinhei para você."],
["senza di te","sem você","Senza di te non è la stessa cosa.","Sem você não é a mesma coisa."],
["con me","comigo","Vieni con me?","Vem comigo?"],
["che (relativo)","que / quem","È la persona che amo.","É a pessoa que eu amo."],
["dedicare","dedicar","Ti dedico questa canzone.","Te dedico esta música."],
["la fortuna","a sorte","Che fortuna averti qui!","Que sorte ter você aqui!"],
["unico / unica","único / única","Sei unica al mondo.","Você é única no mundo."],
["camminare","caminhar","Camminiamo insieme?","Vamos caminhar juntos?"]]},

{n:12,title:"L'estate addosso",artist:"Jovanotti",year:2015,level:"Intermediário",lv:3,
theme:"Stare + gerundio e o ci de lugar",
about:"Um retrato do verão italiano: liberdade, estrada, juventude e a sensação de ter o verão grudado na pele.",
why:"O Jovanotti dos anos 2010, solar e meio falado. Ensina como o italiano fala do que está acontecendo agora, com vocabulário de férias que vocês vão usar em qualquer viagem à Itália.",
hunt:["estate","addosso"],
lesson:"<p><b>stare + gerundio</b> = estar fazendo: <i>Sto mangiando</i>, <i>Stiamo arrivando</i>. Gerúndio: <b>-ando</b> (verbos em -are) e <b>-endo</b> (-ere/-ire).</p><p><b>ci</b> = lá / aqui: <i>Ci vado domani</i> (vou lá amanhã), <i>Ci sei mai stato?</i> (já esteve lá?).</p><p><b>addosso</b> = no corpo, em cima de si.</p>",
cards:[
["sto arrivando","estou chegando","Aspettami, sto arrivando!","Me espera, estou chegando!"],
["stiamo andando","estamos indo","Stiamo andando al mare.","Estamos indo para a praia."],
["addosso","no corpo / em cima de si","Ho ancora la sabbia addosso.","Ainda estou com areia no corpo."],
["ci vado","vou lá","Il mercato? Ci vado domani.","O mercado? Vou lá amanhã."],
["Ci sei mai stato?","Você já esteve lá?","Roma? Ci sei mai stato?","Roma? Você já esteve lá?"],
["le vacanze","as férias","Dove vai in vacanza?","Para onde você vai nas férias?"],
["la spiaggia","a praia (a areia)","Andiamo in spiaggia presto.","Vamos à praia cedo."],
["abbronzato","bronzeado","Sei tutto abbronzato!","Você está todo bronzeado!"],
["partire","partir / viajar","Partiamo sabato mattina.","Viajamos sábado de manhã."],
["libero","livre","Domani sono libero.","Amanhã estou livre."]]},

{n:13,title:"Zitti e buoni",artist:"Måneskin",year:2021,level:"Intermediário",lv:3,
theme:"Imperativo: dando ordens (e levando bronca)",
about:"Rock de uma banda de Roma que venceu Sanremo e o Eurovision em 2021. Um grito contra quem manda os jovens ficarem quietos e se comportarem.",
why:"O título é uma bronca clássica de pais italianos (fiquem quietinhos!). Dicção forte e raivosa, ótima para pegar o imperativo e o som do italiano jovem de hoje.",
hunt:["zitti","buoni","diverso"],
lesson:"<p><b>Imperativo</b>: <i>(tu)</i> <b>parla! guarda! senti!</b> · <i>(voi)</i> <b>parlate! guardate! sentite!</b></p><p>Negativo com <i>tu</i> usa o infinitivo: <b>non parlare!</b>, <b>non toccare!</b></p><p><b>Zitti e buoni!</b> = quietos e comportados (para várias pessoas).</p>",
cards:[
["Zitti e buoni!","Quietos e comportados!","Ragazzi, zitti e buoni!","Pessoal, quietinhos!"],
["Stai zitto!","Fica quieto! / Cala a boca!","Stai zitto un attimo!","Fica quieto um instante!"],
["Guarda!","Olha!","Guarda che bello!","Olha que lindo!"],
["Senti!","Escuta! / Ei!","Senti, ti devo parlare.","Escuta, preciso falar com você."],
["Non toccare!","Não toque!","Non toccare, è caldo!","Não toca, está quente!"],
["Fate silenzio!","Façam silêncio!","Fate silenzio, per favore.","Façam silêncio, por favor."],
["diverso","diferente","Siamo diversi, ed è bello così.","Somos diferentes, e é bom assim."],
["fuori di testa","maluco / fora de si","Sei fuori di testa!","Você é maluco!"],
["urlare","gritar","Non urlare, ti sento.","Não grite, estou te ouvindo."],
["Lasciami stare!","Me deixa em paz!","Lasciami stare, sono stanco.","Me deixa em paz, estou cansado."]]},

{n:14,title:"Soldi",artist:"Mahmood",year:2019,level:"Avançado",lv:4,
theme:"Imperfetto para contar histórias e pronomes antes do verbo",
about:"Vencedora de Sanremo 2019. Mahmood conta a história de um pai ausente que só pensava em dinheiro, misturando na música sua origem ítalo-egípcia.",
why:"Som urbano moderno com um refrão muito fácil de pegar. Mostra o imperfetto narrando o passado e pronomes como 'mi chiedeva', do jeito que se fala hoje.",
hunt:["soldi","come va"],
lesson:"<p>O <b>imperfetto</b> narra hábitos e cenários do passado: <i>mi <b>chiedeva</b> sempre</i> (ele sempre me perguntava).</p><p>O pronome vem antes do verbo: <b>mi</b> chiede, <b>ti</b> chiama, <b>gli</b> dico (digo a ele), <b>le</b> telefono (ligo para ela).</p>",
cards:[
["i soldi","o dinheiro","Non ho soldi per uscire.","Não tenho dinheiro para sair."],
["Come va?","Como vai? / Tudo bem?","Ciao Marco, come va?","Oi Marco, tudo bem?"],
["mi chiedeva","me perguntava","Mia nonna mi chiedeva sempre della scuola.","Minha avó sempre me perguntava da escola."],
["gli dico","digo a ele","Gli dico la verità.","Digo a verdade a ele."],
["le telefono","ligo para ela","Le telefono stasera.","Ligo para ela hoje à noite."],
["pensare a","pensar em","Pensi solo al lavoro!","Você só pensa no trabalho!"],
["il padre / papà","o pai / papai","Mio padre lavorava tanto.","Meu pai trabalhava muito."],
["tornare a casa","voltar para casa","Torno a casa tardi.","Volto para casa tarde."],
["fingere","fingir","Non fingere di non sapere.","Não finja que não sabe."],
["da piccolo","quando pequeno","Da piccolo giocavo in strada.","Quando pequeno eu brincava na rua."]]},

{n:15,title:"Il più grande spettacolo dopo il Big Bang",artist:"Jovanotti",year:2011,level:"Avançado",lv:4,
theme:"Superlativos e comparativos",
about:"Uma explosão de energia: viver e amar como o maior espetáculo desde o nascimento do universo.",
why:"Jovanotti acelerado de novo, mas agora vocês já têm ouvido para isso. O título é uma aula de superlativo, a construção que o italiano usa para exagerar (e italiano adora exagerar).",
hunt:["spettacolo","più grande","Big Bang"],
lesson:"<p><b>il più + adjetivo</b> = o mais: <i>il più grande</i>, <i>la più bella</i>.</p><p><b>-issimo</b> = muito: <i>bellissimo, buonissimo</i>.</p><p><b>più ... di</b> (mais que), <b>meno ... di</b> (menos que). Irregulares: <b>migliore</b> (melhor), <b>peggiore</b> (pior).</p>",
cards:[
["il più grande","o maior","È il più grande del mondo.","É o maior do mundo."],
["bellissimo","lindíssimo","Che giornata bellissima!","Que dia lindíssimo!"],
["più ... di","mais ... que","Roma è più grande di Firenze.","Roma é maior que Florença."],
["meno ... di","menos ... que","Oggi fa meno caldo di ieri.","Hoje está menos quente que ontem."],
["migliore","melhor","È il mio migliore amico.","É o meu melhor amigo."],
["peggiore","pior","È stato il giorno peggiore.","Foi o pior dia."],
["lo spettacolo","o espetáculo / o show","Lo spettacolo inizia alle nove.","O show começa às nove."],
["buonissimo","delicioso","Questa pizza è buonissima!","Esta pizza está deliciosa!"],
["dopo","depois","Ci vediamo dopo cena.","Nos vemos depois do jantar."],
["l'universo","o universo","L'universo è infinito.","O universo é infinito."]]},

{n:16,title:"Occidentali's Karma",artist:"Francesco Gabbani",year:2017,level:"Avançado",lv:4,
theme:"Palavras cultas que o brasileiro já conhece (e falsos amigos)",
about:"Vencedora de Sanremo 2017. Uma sátira bem-humorada aos ocidentais que adotam a espiritualidade oriental como moda, com o famoso dançarino fantasiado de macaco no palco.",
why:"É rápida e cheia de palavras difíceis, mas muitas são parecidas com o português. Ótima para perceber que vocês já entendem mais do que imaginam, e para aprender os falsos amigos.",
hunt:["karma","namasté","scimmia"],
lesson:"<p>Muitas palavras viram italiano trocando a terminação: <b>-ção → -zione</b> (<i>evoluzione, informazione</i>), <b>-dade → -tà</b> (<i>città, libertà, verità</i>).</p><p>Falsos amigos: <b>burro</b> = manteiga, <b>salire</b> = subir, <b>guardare</b> = olhar, <b>caldo</b> = quente.</p>",
cards:[
["la scimmia","o macaco","La scimmia mangia una banana.","O macaco come uma banana."],
["-zione = -ção","evoluzione, informazione","Mi serve un'informazione.","Preciso de uma informação."],
["-tà = -dade","città, libertà, verità","Dimmi la verità.","Me diga a verdade."],
["finalmente","finalmente","Finalmente sei arrivato!","Finalmente você chegou!"],
["ballare","dançar","Andiamo a ballare stasera?","Vamos dançar hoje à noite?"],
["di moda","na moda","Questo colore va di moda.","Esta cor está na moda."],
["il burro (falso amigo)","a manteiga","Pane, burro e marmellata.","Pão, manteiga e geleia."],
["salire (falso amigo)","subir","Saliamo al terzo piano.","Subimos ao terceiro andar."],
["lo stesso","mesmo assim","Piove, ma esco lo stesso.","Chove, mas saio mesmo assim."],
["ridere di","rir de","Non ridere di me!","Não ria de mim!"]]},

{n:17,title:"La noia",artist:"Angelina Mango",year:2024,level:"Avançado",lv:4,
theme:"Condizionale: vorrei, potrei, sarebbe",
about:"Vencedora de Sanremo 2024. Uma cumbia italiana sobre dançar e viver intensamente para escapar do tédio, mesmo nos dias difíceis.",
why:"O desafio final: rapidíssima e cheia de ritmo, com a mesma energia do Jovanotti numa voz nova. Se vocês acompanharem esta, o ouvido está pronto para a Itália de verdade.",
hunt:["noia","cumbia"],
lesson:"<p><b>Condizionale</b> = o nosso <i>-ria</i>: <b>vorrei</b> (eu gostaria/queria), <b>potrei</b> (eu poderia), <b>sarebbe</b> (seria), <b>dovresti</b> (você deveria).</p><p>É o jeito educado de pedir: <i><b>Vorrei</b> un caffè, per favore</i>.</p><p><b>Che noia!</b> = que chato!</p>",
cards:[
["la noia","o tédio","Che noia questa riunione!","Que tédio esta reunião!"],
["Che noia!","Que chato!","Piove ancora? Che noia!","Ainda chovendo? Que chato!"],
["vorrei","eu gostaria / eu queria","Vorrei un caffè, per favore.","Eu queria um café, por favor."],
["potrei","eu poderia","Potrei venire più tardi.","Eu poderia vir mais tarde."],
["sarebbe bello","seria bom","Sarebbe bello vivere in Italia.","Seria bom morar na Itália."],
["dovresti","você deveria","Dovresti riposare un po'.","Você deveria descansar um pouco."],
["mi piacerebbe","eu adoraria","Mi piacerebbe imparare a ballare.","Eu adoraria aprender a dançar."],
["la festa","a festa","Stasera c'è una festa da Luca.","Hoje à noite tem festa na casa do Luca."],
["vivere","viver","Voglio vivere ogni giorno.","Quero viver cada dia."],
["anche se","mesmo que / embora","Esco anche se piove.","Saio mesmo que chova."]]}
],
 imm:`<p><b>Para começar (fala lenta e visual):</b> <a href="https://www.youtube.com/results?search_query=peppa+pig+italiano" target="_blank" rel="noopener">Peppa Pig em italiano</a>. Parece bobo, mas é o input mais compreensível que existe para as primeiras semanas.</p>
 <p><b>Para o carro:</b> <a href="https://www.youtube.com/results?search_query=easy+italian" target="_blank" rel="noopener">Easy Italian</a> (entrevistas de rua), <a href="https://www.youtube.com/results?search_query=podcast+italiano+davide+gemello" target="_blank" rel="noopener">Podcast Italiano</a> (tem episódios para iniciantes), <a href="https://www.youtube.com/results?search_query=italiano+automatico" target="_blank" rel="noopener">Italiano Automatico</a>.</p>
 <p><b>Séries e filmes (TV, com legenda em italiano):</b> séries italianas da Netflix, como Summertime, e qualquer filme ou série que vocês já gostam com o áudio trocado para italiano.</p>`},

{n:1,title:"Lieblingsmensch",artist:"Namika",year:2015,level:"Iniciante",lv:1,
theme:"Pronomes e o verbo sein",
about:"Uma declaração carinhosa para a pessoa favorita: aquela com quem dá para ser 100% você, rir de bobeira e não precisar fingir nada.",
why:"Voz clara, ritmo tranquilo e vocabulário afetivo do dia a dia. Um dos maiores hits pop alemães da última década.",
hunt:["Lieblingsmensch","Hallo","du","ich"],
lesson:"<p><b>sein</b> (ser/estar): <i>ich bin, du bist, er/sie ist, wir sind, ihr seid, sie sind</i>.</p><p>O alemão adora juntar palavras: <b>Lieblings-</b> + qualquer coisa = favorito. <i>Lieblingsessen</i> (comida favorita), <i>Lieblingsfilm</i>, <i>Lieblingsmensch</i> (pessoa favorita).</p><p>Todo substantivo começa com letra maiúscula.</p>",
cards:[
["ich bin","eu sou / estou","Ich bin müde.","Estou cansado."],
["du bist","você é / está","Du bist sehr nett.","Você é muito legal."],
["der Lieblingsmensch","a pessoa favorita","Meine Mutter ist mein Lieblingsmensch.","Minha mãe é minha pessoa favorita."],
["Lieblings-","favorito (prefixo)","Pizza ist mein Lieblingsessen.","Pizza é minha comida favorita."],
["Hallo!","Oi!","Hallo, wie geht's?","Oi, tudo bem?"],
["Wie geht's dir?","Como você está?","Wie geht's dir heute?","Como você está hoje?"],
["mit dir","com você","Ich gehe gern mit dir spazieren.","Gosto de passear com você."],
["verstehen","entender","Ich verstehe dich.","Eu te entendo."],
["lachen","rir","Wir lachen viel zusammen.","Rimos muito juntos."],
["zusammen","juntos","Wir essen zusammen.","Comemos juntos."],
["genau","exatamente","Genau, das meine ich!","Exatamente, é isso que quero dizer!"]]},

{n:2,title:"Sonne",artist:"Rammstein",year:2001,level:"Iniciante",lv:1,
theme:"Números de 1 a 10 e os artigos der/die/das",
about:"Uma contagem lenta e pesada até o sol aparecer. Imagem forte, quase épica, e uma das músicas alemãs mais conhecidas no mundo.",
why:"Cantada devagar, com consoantes bem marcadas. A contagem fixa os números de vez e treina o som duro do alemão.",
hunt:["eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","Sonne"],
lesson:"<p>Números: <i>eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn</i>.</p><p>Três artigos: <b>der</b> (masculino), <b>die</b> (feminino), <b>das</b> (neutro). Não dá para adivinhar: aprenda sempre a palavra junto com o artigo. <i>die Sonne</i> é feminino, <i>der Mond</i> é masculino (o contrário do português!).</p>",
cards:[
["eins, zwei, drei","um, dois, três","Eins, zwei, drei – los!","Um, dois, três – vai!"],
["vier, fünf, sechs","quatro, cinco, seis","Ich habe vier Katzen.","Tenho quatro gatos."],
["sieben, acht, neun, zehn","sete, oito, nove, dez","Der Zug kommt um acht.","O trem chega às oito."],
["die Sonne","o sol (feminino!)","Die Sonne scheint.","O sol está brilhando."],
["der Mond","a lua (masculino!)","Der Mond ist heute voll.","A lua está cheia hoje."],
["scheinen","brilhar","Heute scheint die Sonne.","Hoje o sol brilha."],
["der Himmel","o céu","Der Himmel ist blau.","O céu está azul."],
["heiß","quente","Es ist heute sehr heiß.","Hoje está muito quente."],
["hell / dunkel","claro / escuro","Im Winter ist es früh dunkel.","No inverno escurece cedo."],
["das Licht","a luz","Mach bitte das Licht an.","Acenda a luz, por favor."]]},

{n:3,title:"Nur noch kurz die Welt retten",artist:"Tim Bendzko",year:2011,level:"Iniciante",lv:1,
theme:"Verbos modais: müssen, wollen, können",
about:"O narrador adoraria encontrar a pessoa, mas antes precisa \"salvar o mundo\" e dar conta de uma pilha de e-mails. Uma ironia simpática sobre a vida corrida.",
why:"Dicção limpíssima, frases curtas e repetidas. Os verbos modais aparecem o tempo todo, e eles estão em quase toda frase alemã.",
hunt:["Welt","retten","muss","kurz","Mails"],
lesson:"<p>Verbo modal na 2ª posição, infinitivo lá no <b>final</b> da frase: <i>Ich <b>muss</b> heute <b>arbeiten</b></i>.</p><p><b>müssen</b> (ter que), <b>wollen</b> (querer), <b>können</b> (poder/conseguir).</p><p><b>nur noch kurz</b> = só mais um pouquinho / rapidinho.</p>",
cards:[
["ich muss","eu preciso / tenho que","Ich muss heute arbeiten.","Tenho que trabalhar hoje."],
["ich will","eu quero","Ich will nach Berlin fahren.","Quero ir a Berlim."],
["ich kann","eu posso / sei / consigo","Ich kann gut kochen.","Sei cozinhar bem."],
["nur noch kurz","só mais um pouquinho","Ich muss nur noch kurz telefonieren.","Só preciso dar uma ligação rápida."],
["retten","salvar","Der Hund hat das Kind gerettet.","O cachorro salvou a criança."],
["die Welt","o mundo","Die Welt ist klein.","O mundo é pequeno."],
["die Zeit","o tempo","Ich habe keine Zeit.","Não tenho tempo."],
["später","mais tarde","Ich rufe dich später an.","Te ligo mais tarde."],
["gleich","já, num instante","Ich komme gleich!","Já vou!"],
["warten","esperar","Kannst du kurz warten?","Pode esperar um pouco?"],

/* ===================== ESTADO ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const IV=[0,1,3,7,14,30,60,120],IMM_GOAL=30;
const KEY='ascolto-familia-v1';
const blankC=()=>({started:[1],checks:{},srs:{},mine:[],imm:{}});
const blank=name=>({name,days:[],c:{it:blankC(),de:blankC()}});
let db=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!Array.isArray(db.profiles))db={active:0,profiles:[blank('Leandro'),blank('Esposa'),blank('Filha')]};
function migrate(){
  db.profiles.forEach(p=>{
    if(!p.c){p.c={it:{started:p.started||[1],checks:p.checks||{},srs:p.srs||{},mine:p.mine||[],imm:p.imm||{}}};['started','checks','srs','mine','imm'].forEach(k=>delete p[k])}
    Object.keys(COURSES).forEach(l=>{if(!p.c[l])p.c[l]=blankC()});
    p.days=p.days||[];
  });
  if(typeof db.voice!=='object'||!db.voice)db.voice=typeof db.voice==='string'?{it:db.voice}:{};
  db.dir=db.dir||'it';
  if(db.lang&&!COURSES[db.lang])db.lang=null;
}
migrate();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const P=()=>db.profiles[db.active]||db.profiles[0];
const CO=()=>COURSES[db.lang];
const C=()=>P().c[db.lang];
const WK=()=>CO().weeks;

function cardById(id){const m=/^w(\d+)-(\d+)$/.exec(id);if(!m)return null;const w=WK().find(x=>x.n===+m[1]);const c=w&&w.cards[+m[2]];return c?{id,w:w.n,it:c[0],pt:c[1],ex:c[2],exPt:c[3]}:null}
function deck(c){const ids=[];c.started.slice().sort((a,b)=>a-b).forEach(n=>{const w=WK().find(x=>x.n===n);if(w)w.cards.forEach((_,i)=>ids.push(`w${n}-${i}`))});c.mine.forEach(m=>ids.push('m-'+m.id));return ids}
function getCard(id){if(id.startsWith('m-')){const m=C().mine.find(x=>'m-'+x.id===id);return m?{id,it:m.it,pt:m.pt,ex:m.note||'',exPt:''}:null}return cardById(id)}
function dueList(c){const t=today(),due=[],fresh=[];deck(c).forEach(id=>{const s=c.srs[id];if(!s)fresh.push(id);else if(s.due<=t)due.push(id)});return{due,fresh}}
function markDay(){const p=P(),t=today();if(!p.days.includes(t)){p.days.push(t);if(p.days.length>400)p.days=p.days.slice(-400)}}
function streak(p){let n=0,d=today();if(!p.days.includes(d))d=addDays(d,-1);while(p.days.includes(d)){n++;d=addDays(d,-1)}return n}
function immDay(c,d){return (c.imm||{})[d]||0}
function immWeek(c){let s=0,d=today();for(let i=0;i<7;i++){s+=immDay(c,d);d=addDays(d,-1)}return s}
function addImm(m){const c=C();c.imm=c.imm||{};const t=today();c.imm[t]=Math.max(0,(c.imm[t]||0)+m);markDay();save();render()}

/* ===================== VOZ ===================== */
let curVoice=null,langVoices=[];
function voiceScore(v){const n=v.name.toLowerCase();let s=0;
  if(/natural|neural|online/.test(n))s+=50;
  if(/premium|enhanced|aprimorad|migliorat|erweitert/.test(n))s+=40;
  if(/google/.test(n))s+=30;
  if(/alice|federica|luca|elsa|isabella|diego|paola|emma|giuseppe|anna|petra|markus|yannick|helena|katja|conrad|amala|seraphina|florian/.test(n))s+=10;
  if(!v.localService)s+=5;
  if(/espeak|compact|robot/.test(n))s-=60;
  return s}
function pickVoice(){try{
  if(!db.lang)return;
  const re=new RegExp('^'+CO().lang,'i');
  langVoices=speechSynthesis.getVoices().filter(x=>re.test(x.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  curVoice=(db.voice[db.lang]&&langVoices.find(x=>x.voiceURI===db.voice[db.lang]))||langVoices[0]||null;
}catch(e){}}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{pickVoice();if(view==='settings')render()}}
function say(t){if(!('speechSynthesis' in window)){alert('Seu navegador não tem leitura em voz alta.');return}
  if(!curVoice)pickVoice();
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  u.lang=curVoice?curVoice.lang:(CO().lang==='it'?'it-IT':'de-DE');if(curVoice)u.voice=curVoice;u.rate=.88;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();say(b.dataset.say)}});
const spk=t=>`<button class="spk" data-say="${esc(t)}" aria-label="Ouvir">🔊</button>`;

/* ===================== NAVEGAÇÃO ===================== */
let view=db.lang?'home':'lang',param=null,session=null;
function go(v,p){view=v;param=p??null;render();window.scrollTo(0,0)}
function setLang(l){db.lang=l;session=null;save();pickVoice();go('home')}
const TABS=[['home','🏠','Início'],['weeks','🎵','Semanas'],['review','🃏','Cards'],['mine','✍️','Frases'],['method','📖','Método']];

function render(){
  if(!db.lang)view='lang';
  $('#who').innerHTML=db.profiles.map((p,i)=>`<option value="${i}" ${i===db.active?'selected':''}>${esc(p.name)}</option>`).join('');
  $('#langBtn').textContent=db.lang?CO().flag:'🌍';
  $('#ttl').innerHTML=db.lang?`Ascolto <span>· ${esc(CO().name)}</span>`:`Ascolto <span>em Família</span>`;
  $('#nav').style.display=view==='lang'?'none':'flex';
  $('#nav').innerHTML=TABS.map(([k,ic,l])=>`<button class="${(view===k||(k==='weeks'&&view==='week'))?'on':''}" onclick="${k==='review'?'startReview()':`go('${k}')`}"><b>${ic}</b>${l}</button>`).join('');
  const V={lang:langView,home,weeks,week,review,mine,method,settings}[view]||home;
  $('#app').innerHTML=V();
}
$('#who').onchange=function(){db.active=+this.value;session=null;save();render()};

/* ===================== TELAS ===================== */
function langView(){
  const p=P();
  return `<h2 style="text-align:center;margin-top:24px">Qual idioma hoje?</h2>
  <p class="mut" style="text-align:center">Perfil: <b>${esc(p.name)}</b>. Cada idioma tem seu próprio progresso.</p>
  ${Object.entries(COURSES).map(([k,c])=>{const cc=p.c[k],learned=Object.values(cc.srs).filter(s=>s.box>=3).length,cur=Math.max(...cc.started);
  return `<button class="langcard" onclick="setLang('${k}')"><span class="flag">${c.flag}</span><span class="t"><b>${esc(c.name)}</b><span class="mut">Semana ${cur} de ${c.weeks.length} · ${learned} cards firmes</span></span><span class="go">›</span></button>`}).join('')}`;
}

function home(){
  const p=P(),c=C(),co=CO(),{due,fresh}=dueList(c),cur=Math.max(...c.started),w=WK().find(x=>x.n===cur);
  const learned=Object.values(c.srs).filter(s=>s.box>=3).length;
  const done=(c.checks[cur]||[]).filter(Boolean).length,n=due.length+Math.min(fresh.length,10);
  return `<h2>${co.hello}, ${esc(p.name)}! 👋</h2>
  <div class="stats"><div class="stat"><b>${streak(p)}</b><span>dias seguidos</span></div><div class="stat"><b>${n}</b><span>cards hoje</span></div><div class="stat"><b>${learned}</b><span>firmes na memória</span></div></div>
  <div class="card"><div class="mut">Semana ${cur} · ${esc(w.level)}</div><h3 style="margin-top:4px">🎵 ${esc(w.title)} <span class="mut">— ${esc(w.artist)}</span></h3>
  <div class="prog"><i style="width:${done/7*100}%"></i></div><div class="mut" style="margin-bottom:12px">Roteiro: ${done}/7 dias</div>
  <button class="btn" onclick="go('week',${cur})">Continuar semana ${cur}</button></div>
  <div class="card"><h3>🎧 Imersão de hoje</h3><p class="mut" style="margin-top:0">Séries, podcasts, vídeos ou música de fundo, sem se preocupar em entender tudo. Meta: ${IMM_GOAL} min/dia.</p>
  <div class="prog"><i style="width:${Math.min(100,immDay(c,today())/IMM_GOAL*100)}%"></i></div>
  <div class="mut" style="margin-bottom:10px">Hoje: <b>${immDay(c,today())} min</b> · Últimos 7 dias: <b>${Math.round(immWeek(c)/6)/10} h</b></div>
  <div class="row"><button class="btn ghost sm" onclick="addImm(10)">+10</button><button class="btn ghost sm" onclick="addImm(20)">+20</button><button class="btn ghost sm" onclick="addImm(30)">+30</button><button class="btn ghost sm" onclick="addImm(-10)">−10</button></div>
  <button class="btn ghost sm" style="margin-top:8px;width:100%" onclick="go('method')">O que assistir/ouvir?</button></div>
  <div class="card"><h3>🃏 Revisão de hoje</h3><p class="mut">${n?`${due.length} para revisar e ${Math.min(fresh.length,10)} novos.`:'Tudo em dia! Volte amanhã ou faça uma revisão extra.'}</p>
  <button class="btn ${n?'':'ghost'}" onclick="startReview(${n?'':'true'})">${n?'Revisar agora':'Revisão extra'}</button></div>
  ${done===7&&cur<WK().length&&!c.started.includes(cur+1)?`<div class="card"><h3>🎉 Semana ${cur} completa!</h3><button class="btn" onclick="startWeek(${cur+1})">Começar semana ${cur+1}</button></div>`:''}
  <p class="mut" style="text-align:center">Dica: ouvir um pouco todo dia vale mais que muito num dia só.</p>`;
}

function weeks(){
  const c=C();
  return `<h2>Semanas</h2><p class="mut">Uma música por semana. A ordem vai do mais lento e claro ao mais rápido.</p>`+
  WK().map(w=>{const st=c.started.includes(w.n),d=(c.checks[w.n]||[]).filter(Boolean).length;
  return `${w.section?`<h3 style="margin:18px 0 10px;color:var(--mut)">${esc(w.section)}</h3>`:''}<button class="wk" onclick="go('week',${w.n})"><div class="n">${w.n}</div><div class="t"><div>${esc(w.title)}</div><div class="mut">${esc(w.artist)} · ${w.year}</div></div>
  <div style="text-align:right"><span class="lvl l${w.lv}">${esc(w.level)}</span><div class="mut" style="font-size:12px;margin-top:4px">${st?(d===7?'✅ concluída':`${d}/7 dias`):'não iniciada'}</div></div></button>`}).join('');
}

function week(){
  const c=C(),w=WK().find(x=>x.n===param)||WK()[0],st=c.started.includes(w.n),ch=c.checks[w.n]||[];
  const q=encodeURIComponent(`${w.artist} ${w.title}`);
  return `<button class="btn ghost sm" onclick="go('weeks')">← Semanas</button>
  <h2 style="margin-top:12px">Semana ${w.n}</h2>
  <div class="card"><span class="lvl l${w.lv}">${esc(w.level)}</span>
  <h3 style="margin-top:10px;font-size:20px">🎵 ${esc(w.title)}</h3><div class="mut">${esc(w.artist)} · ${w.year}</div>
  <p>${esc(w.about)}</p><p class="mut"><b>Por que esta música:</b> ${esc(w.why)}</p>
  <div class="links"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">▶️ YouTube</a><a href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener">🎧 Spotify</a><a href="https://www.google.com/search?q=${q}%20${CO().lyr}" target="_blank" rel="noopener">📄 Letra</a></div></div>
  <div class="card"><h3>🔎 Caça-palavras</h3><p class="mut">Palavras para pegar de ouvido nesta música:</p>${w.hunt.map(h=>`<span class="chip">${esc(h)}</span>`).join('')}
  <p class="mut" style="margin-bottom:0">Pegou uma frase inteira? Anote na aba <b>Frases</b> com o que entendeu. Ela vira card seu.</p></div>
  <div class="card lesson"><h3>💡 ${esc(w.theme)}</h3>${w.lesson}</div>
  ${st?`<div class="card"><h3>📅 Roteiro da semana</h3>${roteiro().map((r,i)=>`<div class="day ${ch[i]?'done':''}" onclick="toggleDay(${w.n},${i})"><div class="box">${ch[i]?'✓':''}</div><div class="txt"><b>Dia ${i+1} · ${r[0]}</b><div class="mut">${esc(r[1])}</div></div></div>`).join('')}</div>`
  :`<div class="card"><p>Comece a semana para liberar o roteiro e colocar os cards na sua revisão.</p><button class="btn" onclick="startWeek(${w.n})">Começar semana ${w.n}</button></div>`}
  <div class="card"><h3>🗂️ Expressões da semana</h3>${w.cards.map(k=>`<div class="vc">${spk(k[0])}<div><div class="it">${esc(k[0])}</div><div class="mut">${esc(k[1])}</div><div style="font-size:14px;margin-top:4px"><i>${esc(k[2])}</i> ${spk(k[2])}<br><span class="mut">${esc(k[3])}</span></div></div></div>`).join('')}</div>`;
}
function startWeek(n){const c=C();if(!c.started.includes(n))c.started.push(n);markDay();save();go('week',n)}
function toggleDay(n,i){const c=C();const k=c.checks[n]||Array(7).fill(false);k[i]=!k[i];c.checks[n]=k;if(k[i])markDay();save();render()}

function makeSession(extra){
  const c=C();const {due,fresh}=dueList(c);let q=[...due,...fresh.slice(0,10)];
  if(!q.length&&extra)q=deck(c).sort(()=>Math.random()-.5).slice(0,20);
  return {queue:q,done:0,shown:false};
}
function startReview(extra){session=makeSession(extra);go('review');autoSay()}
function autoSay(){if(db.dir==='audio'&&session&&session.queue.length&&!session.shown){const c=getCard(session.queue[0]);if(c)setTimeout(()=>say(c.it),150)}}
function review(){
  if(!session)session=makeSession(false);
  const L=CO().name;
  if(!session.queue.length){
    return `<h2>Cards</h2><div class="card" style="text-align:center"><div style="font-size:48px">🎉</div>
    <h3>${session.done?`Ótimo! ${session.done} respostas hoje.`:'Nada para revisar agora.'}</h3>
    <p class="mut">A revisão espaçada traz cada card de volta na hora certa. Volte amanhã.</p>
    <button class="btn ghost" onclick="startReview(true)">Revisão extra (20 aleatórios)</button></div>
    <div class="card"><h3>Direção dos cards</h3><div class="row"><button class="btn ${db.dir==='it'?'':'ghost'} sm" onclick="setDir('it')">${L} → Português</button><button class="btn ${db.dir==='pt'?'':'ghost'} sm" onclick="setDir('pt')">Português → ${L}</button></div><button class="btn ${db.dir==='audio'?'':'ghost'} sm" style="margin-top:8px;width:100%" onclick="setDir('audio')">🎧 Só áudio (sem texto na frente)</button></div>`;
  }
  const c=getCard(session.queue[0]);if(!c){session.queue.shift();return review()}
  const s=C().srs[c.id],isNew=!s,au=db.dir==='audio';
  const front=au?'🎧 Ouça e tente entender':db.dir==='pt'?c.pt:c.it,back=db.dir==='pt'?c.it:au?`${c.it} — ${c.pt}`:c.pt;
  return `<div class="row" style="align-items:center;margin-bottom:10px"><div class="mut">${session.queue.length} restantes ${isNew?'· <b style="color:var(--acc2)">novo</b>':''}</div><div style="text-align:right" class="mut">${c.w?`Semana ${c.w}`:'Minha frase'}</div></div>
  <div class="card flash" onclick="${session.shown?'':'reveal()'}">
    <div class="front" style="${au?'font-size:20px':''}">${esc(front)}</div>${db.dir!=='pt'?spk(c.it):''}
    ${session.shown?`<div class="back">${esc(back)}</div>${db.dir==='pt'?spk(c.it):''}
      ${c.ex?`<div class="ex">${esc(c.ex)} ${c.w?spk(c.ex):''}</div>`:''}${c.exPt?`<div class="mut">${esc(c.exPt)}</div>`:''}`
    :`<div class="mut" style="margin-top:16px">Toque para ver a resposta</div>`}
  </div>
  ${session.shown?`<div class="grades"><button class="g0" onclick="grade(0)">Errei<small>agora</small></button><button onclick="grade(1)">Difícil<small>${lbl(1,s)}</small></button><button onclick="grade(2)">Bom<small>${lbl(2,s)}</small></button><button class="g3" onclick="grade(3)">Fácil<small>${lbl(3,s)}</small></button></div>`
  :`<button class="btn" onclick="reveal()">Mostrar resposta</button>`}`;
}
function nextBox(g,s){const b=s?s.box:0;return g===1?Math.max(1,b):Math.min(7,g===2?b+1:b+2)}
function lbl(g,s){const d=IV[nextBox(g,s)];return d===1?'1 dia':d+' dias'}
function reveal(){session.shown=true;render();const c=getCard(session.queue[0]);if(c&&db.dir==='pt')say(c.it)}
function grade(g){
  const c=C(),id=session.queue.shift(),s=c.srs[id]||{box:0};
  if(g===0){s.box=0;s.due=today();session.queue.push(id)}
  else{s.box=nextBox(g,c.srs[id]);s.due=addDays(today(),IV[s.box])}
  c.srs[id]=s;session.done++;session.shown=false;markDay();save();render();autoSay();
}
function setDir(d){db.dir=d;save();render()}

function mine(){
  const c=C(),L=CO().name;
  return `<h2>Minhas frases</h2>
  <div class="card"><p class="mut" style="margin-top:0">Anote frases e expressões que você pegou de ouvido (músicas, séries, conversas) ou que você mesmo montou com as estruturas da semana. Elas entram nos seus cards.</p>
  <label>Em ${esc(L)}</label><input id="fIt">
  <label>Significado</label><input id="fPt">
  <label>Cena / contexto (onde ouviu, quem disse, qual emoção)</label><input id="fNote" placeholder="ex.: personagem gritou quando derrubou o café">
  <div style="margin-top:12px"><button class="btn" onclick="addMine()">Adicionar card</button></div></div>
  ${c.mine.length?`<div class="card">${c.mine.slice().reverse().map(m=>`<div class="vc">${spk(m.it)}<div style="flex:1"><div class="it">${esc(m.it)}</div><div class="mut">${esc(m.pt)}</div>${m.note?`<div class="mut" style="font-size:13px">📝 ${esc(m.note)}</div>`:''}</div><button class="del" onclick="delMine('${m.id}')">apagar</button></div>`).join('')}</div>`
  :'<p class="mut" style="text-align:center">Nenhuma frase ainda.</p>'}`;
}
function addMine(){const it=$('#fIt').value.trim(),pt=$('#fPt').value.trim(),note=$('#fNote').value.trim();
  if(!it||!pt){alert('Preencha a frase e o significado.');return}
  C().mine.push({id:Date.now().toString(36),it,pt,note});markDay();save();render()}
function delMine(id){if(!confirm('Apagar esta frase?'))return;const c=C();c.mine=c.mine.filter(m=>m.id!==id);delete c.srs['m-'+id];save();render()}

function method(){
  return `<h2>O método</h2>
  <div class="card"><h3>Stephen Krashen e o Natural Approach</h3>
  <p>O linguista Stephen Krashen propôs, com Tracy Terrell, a <b>Abordagem Natural</b> (1983). A ideia central: a gente <b>adquire</b> uma língua quando entende mensagens nela, não quando decora regras.</p>
  <p><b>Input compreensível (i+1):</b> o que acelera é ouvir e ler coisas que você entende quase tudo, com um pouco a mais do que seu nível atual.</p>
  <p><b>Aquisição × aprendizagem:</b> gramática decorada ajuda a revisar o que você fala, mas a fluência vem da exposição repetida.</p>
  <p style="margin-bottom:0"><b>Filtro afetivo:</b> ansiedade e medo de errar bloqueiam a aquisição. Por isso música funciona tão bem: é prazeroso e você repete sem perceber.</p></div>
  <div class="card"><h3>Como este app aplica</h3>
  <p>🎵 <b>Uma música por semana</b>, ouvida todo dia de jeitos diferentes (às cegas, com letra, passiva, cantando junto).</p>
  <p>🗂️ <b>Cards com revisão espaçada</b> como apoio, incluindo o modo só áudio para treinar o ouvido.</p>
  <p>✍️ <b>Frases suas</b>, com a cena em que você ouviu: o que você pega de ouvido vale mais do que qualquer lista pronta.</p>
  <p style="margin-bottom:0">👨‍👩‍👧 <b>Em família</b>: cada um tem seu perfil e progresso por idioma.</p></div>
  <div class="card"><h3>🎧 Imersão: o volume que falta</h3>
  <p>A música da semana é o estudo <b>intensivo</b>. Krashen também pede volume: horas de escuta <b>extensiva</b>, sem pausar nem traduzir. Registre os minutos na tela Início.</p>
  ${CO().imm}
  <p style="margin-bottom:0"><b>Truque:</b> filmes que vocês já conhecem de cor em português, assistidos no idioma novo. Como vocês já sabem a história, quase tudo vira input compreensível.</p></div>
  <div class="card"><h3>Regras de ouro</h3><p>1. Todo dia, nem que sejam 10 minutos.<br>2. Não pare para traduzir tudo. Deixe a música te levar.<br>3. Repita a mesma música até ela ficar "transparente".<br>4. Use as expressões em voz alta, mesmo sozinho.</p></div>`;
}

function settings(){
  if(db.lang&&!langVoices.length)pickVoice();
  return `<h2>Configurações</h2>
  <div class="card"><h3>Perfis</h3>${db.profiles.map((p,i)=>`<label>Perfil ${i+1}</label><input value="${esc(p.name)}" onchange="renameP(${i},this.value)">`).join('')}
  <div style="margin-top:12px"><button class="btn ghost" onclick="addP()">+ Adicionar perfil</button></div></div>
  ${db.lang?`<div class="card"><h3>Voz (${esc(CO().name)})</h3>
  ${langVoices.length?`<select onchange="setVoice(this.value)">${langVoices.map(v=>`<option value="${esc(v.voiceURI)}" ${curVoice&&v.voiceURI===curVoice.voiceURI?'selected':''}>${esc(v.name)}</option>`).join('')}</select>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm" onclick="say(CO().test)">🔊 Testar voz</button></div>`
  :`<p class="mut">Nenhuma voz deste idioma encontrada neste navegador.</p>`}
  <p class="mut" style="margin-bottom:0">As vozes vêm do aparelho. Se todas soarem robóticas, abra o app no Chrome ou Safari. No iPhone, dá para baixar vozes melhores em Ajustes → Acessibilidade → Conteúdo Falado → Vozes.</p></div>`:''}
  <div class="card"><h3>Backup do progresso</h3><p class="mut">O progresso fica salvo neste aparelho. Exporte para guardar ou passar para outro celular.</p>
  <div class="row"><button class="btn sm" onclick="exportDb()">Exportar</button><button class="btn ghost sm" onclick="$('#imp').click()">Importar</button></div>
  <input type="file" id="imp" accept="application/json" style="display:none" onchange="importDb(this)"></div>
  ${db.lang?`<div class="card"><h3>Zerar ${esc(CO().name)} de ${esc(P().name)}</h3><p class="mut">Apaga só o progresso deste idioma neste perfil.</p><button class="btn ghost sm" style="color:var(--bad)" onclick="resetP()">Zerar</button></div>`:''}`;
}
function setVoice(uri){db.voice[db.lang]=uri;curVoice=langVoices.find(x=>x.voiceURI===uri)||curVoice;save();say(CO().test)}
function renameP(i,v){v=v.trim();if(!v)return;db.profiles[i].name=v;save();render()}
function addP(){const n=prompt('Nome do novo perfil:');if(n&&n.trim()){db.profiles.push(blank(n.trim()));save();render()}}
function resetP(){if(!confirm('Tem certeza? Isso não pode ser desfeito.'))return;P().c[db.lang]=blankC();session=null;save();render()}
function exportDb(){try{const b=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`ascolto-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove()}catch(e){alert('Não foi possível exportar aqui.')}}
function importDb(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.profiles))throw 0;db=d;db.active=0;migrate();session=null;save();pickVoice();render();alert('Progresso importado!')}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}

pickVoice();
render();
</script>
</body>
</html>
