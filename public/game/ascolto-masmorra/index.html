<title>Ascolto Masmorra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap">
<style>
  /* Layout: coluna única de celular. Cabeçalho fixo (vida, turno, idioma),
     3 telas (mapa, desafio em tela cheia, inventário) e barra de abas embaixo.
     Mundo único e escuro: pedra azulada, giz e luz de lanterna. */
  :root {
    color-scheme: dark;
    --bg: #0b1d2b;
    --bg2: #0f2638;
    --panel: #12293c;
    --panel2: #183650;
    --line: #2a4a62;
    --chalk: #e6edf0;
    --dim: #9fb0bb;
    --lantern: #ffd166;
    --lantern-ink: #2a1c00;
    --ok: #2cb78e;
    --bad: #ff4d6d;
    --heart: #ff4d6d;
    --gm: #62b6ff;
    --gf: #ff8aa8;
    --gn: #b7e35e;
    --r-common: #9aa8b3;
    --r-uncommon: #38d0bd;
    --r-rare: #9a8cff;
    --r-epic: #e062d6;
    --r-legendary: #ffc93d;
    --font-ui: 'Poppins', system-ui, -apple-system, 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --font-pixel: 'Montserrat', 'Poppins', system-ui, sans-serif;
    --teal: #16a995;
    --teal2: #2cb78e;
    --font-ja: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--chalk);
    font: 16px/1.45 var(--font-ui);
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    background: var(--bg2); z-index: 30;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, [role="button"]:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
  .wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* texto em japonês e artigos */
  .ja, ruby.ja { font-family: var(--font-ja); }
  ruby rt { font-size: .46em; font-weight: 400; color: var(--dim); letter-spacing: .02em; }
  .art { font-weight: 700; }
  .g-m { color: var(--gm); } .g-f { color: var(--gf); } .g-n { color: var(--gn); }
  .romaji { font-size: .8em; color: var(--dim); font-weight: 400; }

  /* cabeçalho */
  .hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg2); border-bottom: 1px solid var(--line); }
  .hud-in { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; padding-bottom: 10px; }
  .hud-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .logo { margin: 0; font: 700 18px/1 var(--font-pixel); letter-spacing: .02em; }
  .logo span { color: var(--lantern); }
  .langs { display: flex; gap: 4px; }
  .lang { min-height: 36px; padding: 4px 11px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 700; }
  .lang.on { background: var(--lantern); border-color: var(--lantern); color: var(--lantern-ink); }
  #stats { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .hearts { display: flex; gap: 2px; font-size: 21px; line-height: 1; }
  .h { color: var(--heart); } .h.off { color: #2f4152; }
  .chips { display: flex; gap: 12px; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .chips .rv { color: var(--lantern); font-weight: 700; }

  .screen { padding-top: 12px; }

  /* mapa */
  .map-note { margin: 0 0 10px; font-size: 14px; color: var(--dim); min-height: 2.6em; }
  .map-wrap {
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: radial-gradient(circle at 1px 1px, #263a4c 1px, transparent 1.3px) 0 0 / 16px 16px, var(--bg2);
  }
  #map { display: block; width: 100%; height: calc(100vh - 200px); height: calc(100svh - 200px); min-height: 440px; max-height: 680px; }
  .cor { fill: none; stroke: var(--line); stroke-width: 8; stroke-linejoin: round; opacity: .45; }
  .cor.open { stroke: #56708a; opacity: .9; }
  .room rect { fill: var(--panel); stroke: var(--line); stroke-width: 2; }
  .room.unk rect { fill: var(--bg); stroke-dasharray: 4 4; opacity: .8; }
  .room.visited rect { stroke: #6f8aa2; }
  .room.cur rect { stroke: var(--lantern); stroke-width: 3; }
  .room.reach rect { stroke: var(--lantern); stroke-dasharray: 7 5; }
  .room.reach { cursor: pointer; }
  .room.t-boss rect { stroke: var(--r-epic); }
  .room.t-boss.locked rect { stroke-dasharray: 3 4; }
  .room .ico { font-size: 26px; text-anchor: middle; dominant-baseline: central; }
  .room .ico.q { font: 700 20px var(--font-pixel); fill: #4b6074; }
  .room.t-boss .ico { font-size: 32px; }
  .room.done .ico { opacity: .4; }
  .room .num { font: 700 10px var(--font-pixel); fill: var(--dim); }
  .room .ok { font: 700 12px var(--font-ui); fill: var(--ok); text-anchor: end; }
  .player { transition: transform .35s ease; pointer-events: none; }
  .player text { font-size: 23px; text-anchor: middle; dominant-baseline: central; }
  .legend { margin: 10px 0 0; font-size: 13px; color: var(--dim); }
  #newRun { margin-top: 12px; }

  /* botões */
  .btn { display: block; width: 100%; min-height: 50px; padding: 12px 18px; border-radius: 12px; border: 2px solid var(--lantern); background: var(--lantern); color: var(--lantern-ink); font-size: 17px; font-weight: 700; }
  .btn.ghost { background: transparent; color: var(--chalk); border-color: var(--line); }
  .btn + .btn { margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two .btn + .btn { margin-top: 0; }
  .ghost-sm { min-height: 40px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 700; }

  /* desafio */
  .quiz { display: flex; flex-direction: column; gap: 12px; }
  .enc { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .enc-art { font-size: 54px; line-height: 1; flex: none; }
  .enc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .enc-kind { font: 500 13px var(--font-pixel); letter-spacing: .08em; text-transform: uppercase; color: var(--lantern); }
  .enc-sub { font-size: 14px; color: var(--dim); }
  .mon-name { background: none; border: 0; padding: 0; font-size: 22px; font-weight: 700; text-align: left; min-height: 32px; }
  .pt-inline { font-size: 15px; font-weight: 400; color: var(--dim); }
  .mon-hp { display: flex; gap: 4px; }
  .pip { width: 16px; height: 10px; border-radius: 3px; background: #2b3d4d; }
  .pip.on { background: var(--bad); }
  .qcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .q-label { margin: 0; font-size: 14px; color: var(--dim); text-align: center; }
  .q-word { font-size: 38px; font-weight: 700; text-align: center; margin: 12px 0 2px; line-height: 1.5; overflow-wrap: anywhere; }
  .q-sub { text-align: center; min-height: 1em; }
  .q-say { display: flex; justify-content: center; margin: 10px 0 4px; }
  .say { min-height: 44px; padding: 8px 16px; border-radius: 22px; border: 2px solid var(--line); background: var(--panel2); font-size: 16px; font-weight: 700; }
  .say.sm { min-height: 36px; min-width: 36px; padding: 4px 10px; font-size: 15px; }
  .bigsay { width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--lantern); background: var(--panel2); font-size: 38px; margin: 12px 0 6px; }
  .q-prompt { display: flex; flex-direction: column; align-items: center; margin: 12px 0 14px; gap: 2px; }
  .q-emoji { font-size: 64px; line-height: 1.1; }
  .q-pt { font-size: 26px; font-weight: 700; }
  .opts { display: grid; gap: 10px; margin-top: 14px; }
  .opts.tiles { grid-template-columns: 1fr 1fr; }
  .opt { min-height: 54px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel2); font-size: 18px; font-weight: 700; text-align: left; }
  .opts.tiles .opt { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; font-size: 16px; }
  .o-emoji { font-size: 36px; line-height: 1.2; }
  .opt.ok { border-color: var(--ok); background: #1b3a2c; }
  .opt.bad { border-color: var(--bad); background: #402226; }
  .opt.dim { opacity: .5; }
  .opt:disabled { cursor: default; }
  .speak { display: flex; flex-direction: column; gap: 10px; }
  .sp-msg { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--panel2); font-size: 14px; color: var(--dim); }
  .sp-ask { margin: 4px 0 0; text-align: center; font-weight: 700; }
  .reveal-word { font-size: 36px; font-weight: 700; text-align: center; line-height: 1.5; }
  .listening { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; font-weight: 700; }
  .rec { width: 14px; height: 14px; border-radius: 50%; background: var(--bad); }
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 12px; border-left: 5px solid var(--ok); background: #18302a; }
  .result.badr { border-left-color: var(--bad); background: #35212a; }
  .result p { margin: 0 0 4px; font-size: 15px; }
  .result .fb { font-size: 18px; font-weight: 700; }
  .reveal { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--rc, var(--line)); background: var(--panel2); }
  .rv-emoji { font-size: 38px; line-height: 1; }
  .rv-body { flex: 1; min-width: 0; }
  .rv-name { font-size: 22px; font-weight: 700; line-height: 1.5; }
  .rv-pt { color: var(--dim); font-size: 15px; }
  .go { margin-top: 14px; }
  .rt-common { color: var(--r-common); } .rt-uncommon { color: var(--r-uncommon); } .rt-rare { color: var(--r-rare); } .rt-epic { color: var(--r-epic); } .rt-legendary { color: var(--r-legendary); }

  /* inventário */
  .inv-head h2 { margin: 0; font: 700 20px var(--font-pixel); }
  .inv-sub { margin: 2px 0 10px; font-size: 14px; color: var(--dim); }
  .gleg { display: flex; gap: 14px; font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--dim); }
  .chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .fchip { flex: none; min-height: 38px; padding: 4px 14px; border-radius: 19px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 700; }
  .fchip.on { background: var(--chalk); border-color: var(--chalk); color: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card { height: 236px; perspective: 900px; cursor: pointer; border-radius: 14px; min-width: 0; }
  .card-in { position: relative; width: 100%; height: 100%; transition: transform .45s ease; transform-style: preserve-3d; }
  .card.flipped .card-in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; border: 2px solid var(--rc); background: linear-gradient(180deg, var(--panel2), var(--panel)); padding: 10px 12px; display: flex; flex-direction: column; box-shadow: 0 0 16px -8px var(--rc); overflow: hidden; }
  .face.back { transform: rotateY(180deg); }
  .rar-common { --rc: var(--r-common); } .rar-uncommon { --rc: var(--r-uncommon); } .rar-rare { --rc: var(--r-rare); } .rar-epic { --rc: var(--r-epic); } .rar-legendary { --rc: var(--r-legendary); }
  .c-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .rar-tag { font-weight: 700; color: var(--rc); text-transform: uppercase; letter-spacing: .06em; }
  .pips-d { color: var(--rc); letter-spacing: -1px; font-size: 11px; }
  .c-emoji { font-size: 46px; text-align: center; line-height: 1.25; margin-top: 4px; }
  .c-emoji-sm { font-size: 22px; line-height: 1; }
  .c-name { text-align: center; font-size: 22px; font-weight: 700; line-height: 1.55; flex: 1; display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere; }
  .c-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stars { color: var(--r-legendary); letter-spacing: 1px; }
  .rvb { color: var(--lantern); font-weight: 700; }
  .b-pt { font-size: 22px; font-weight: 700; text-align: center; margin: 6px 0 4px; }
  .trow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 17px; line-height: 1.7; }
  .tag { font: 500 11px var(--font-pixel); color: var(--dim); min-width: 22px; }
  .tname { font-weight: 700; }
  .card.locked { cursor: default; opacity: .8; }
  .card.locked .face { border-style: dashed; background: var(--bg2); box-shadow: none; }
  .c-emoji.sil { filter: brightness(0) opacity(.45); }
  .card.locked .c-name { color: #4b6074; }
  .empty { color: var(--dim); text-align: center; padding: 24px 8px; }

  /* barra de abas */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg2); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .tabs-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tab { position: relative; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .tab.on { background: var(--panel2); border-color: var(--lantern); }
  .ti { font-size: 20px; }
  .badge { font-size: 12px; color: var(--lantern); }
  body.in-quiz .tabs { display: none; }
  body.in-quiz { padding-bottom: 32px; }

  /* avisos e fim */
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); max-width: min(92vw, 460px); padding: 10px 16px; border-radius: 12px; background: var(--chalk); color: var(--bg); font-size: 15px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .end { position: fixed; inset: 0; z-index: 50; background: rgba(6, 10, 14, .85); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
  .end-card { width: 100%; max-width: 400px; background: var(--panel); border: 2px solid var(--lantern); border-radius: 16px; padding: 20px; text-align: center; }
  .end-art { font-size: 60px; line-height: 1.1; }
  .end-card h2 { margin: 6px 0 4px; font: 700 22px var(--font-pixel); }
  .end-card p { margin: 0 0 12px; color: var(--dim); }
  .end-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
  .end-stats div { background: var(--panel2); border-radius: 10px; padding: 8px; }
  .end-stats dt { font-size: 12px; color: var(--dim); }
  .end-stats dd { margin: 0; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .end-loot { font-size: 24px; letter-spacing: 2px; overflow-wrap: anywhere; }
  .boot-error { margin: 24px 0; padding: 16px; border: 1px solid var(--bad); border-radius: 12px; }

  /* herói (formas provisórias) */
  .hero { display: block; overflow: visible; }
  .h-skin { fill: #f0c9a0; } .h-tunic { fill: #4f6b86; } .h-pants { fill: #34475a; } .h-shoe { fill: #222c36; }
  .h-eye { fill: #14202a; } .h-hair { fill: #6b4a2f; } .h-shadow { fill: rgba(0, 0, 0, .35); }
  .gf { fill: var(--rc); stroke: rgba(0, 0, 0, .45); stroke-width: 1.4; }
  .gs { fill: rgba(0, 0, 0, .28); }
  .gp.rar-epic .gf, .gp.rar-legendary .gf { filter: drop-shadow(0 0 3px var(--rc)); }
  .sparks circle { fill: var(--lantern); }

  /* história no topo */
  .story { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(180deg, var(--panel), #182630); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .st-portrait { flex: none; width: 88px; background: var(--bg2); border-radius: 10px; padding: 6px 0 2px; display: flex; justify-content: center; }
  .st-body { flex: 1; min-width: 0; }
  .st-top { font: 500 11px var(--font-pixel); letter-spacing: .08em; text-transform: uppercase; color: var(--lantern); }
  .st-title { margin: 2px 0 6px; font-size: 17px; font-weight: 700; line-height: 1.25; }
  .st-text { margin: 0; font-size: 15px; line-height: 1.6; }
  .st-text.sm { font-size: 14px; }
  .sent.tl { color: #fff1cf; }
  .mixw { display: inline; background: none; border: 0; border-bottom: 1px dotted var(--lantern); padding: 2px 1px; margin: 0; font: inherit; color: #fff1cf; cursor: pointer; }
  .st-mix { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .bar { flex: 1; max-width: 110px; height: 6px; border-radius: 3px; background: #2b3d4d; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--lantern); }
  #slotsBox { margin: 10px 0 12px; }
  .slots { display: flex; align-items: center; gap: 6px; }
  .slot { flex: 1 1 0; min-width: 28px; max-width: 46px; aspect-ratio: 1; border-radius: 10px; border: 2px dashed var(--line); background: var(--bg2); font-size: 20px; line-height: 1; display: grid; place-items: center; padding: 0; }
  .slot.on { border-style: solid; border-color: var(--rc); background: var(--panel2); box-shadow: 0 0 12px -5px var(--rc); }
  .slot .ghost { opacity: .28; filter: grayscale(1); }
  .slots-n { flex: none; margin-left: auto; font: 700 14px var(--font-pixel); color: var(--dim); min-width: 30px; text-align: right; }
  .lore-mini { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .hero-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .hr-hero { flex: none; }
  .hero-row .slots { flex: 1; min-width: 0; }
  .lm-top { font: 500 11px var(--font-pixel); letter-spacing: .08em; text-transform: uppercase; color: var(--lantern); margin-bottom: 4px; }
  .prac { margin: 0 0 8px; text-align: center; font-size: 13px; color: var(--lantern); }
  .grades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gbtn { min-height: 58px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 16px; }
  .gbtn small { font-size: 13px; color: var(--dim); }
  .gbtn.g1 { border-color: var(--bad); } .gbtn.g2 { border-color: var(--lantern); } .gbtn.g3 { border-color: var(--ok); } .gbtn.g4 { border-color: var(--gm); }
  .result .srs { color: var(--dim); }

  /* inventário do herói */
  .inv-head.words { margin-top: 22px; }
  .paper { display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; gap: 8px; align-items: center; padding: 14px 8px; border: 1px solid var(--line); border-radius: 14px; background: radial-gradient(circle at 50% 40%, #223648, var(--bg2) 70%); }
  .pcol { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .pcell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .pslot { width: 58px; height: 58px; border-radius: 12px; border: 2px dashed var(--line); background: var(--bg2); font-size: 28px; line-height: 1; display: grid; place-items: center; padding: 0; }
  .pslot.on { border-style: solid; border-color: var(--rc); background: var(--panel2); box-shadow: 0 0 14px -5px var(--rc); }
  .pslot.sel { outline: 3px solid var(--lantern); outline-offset: 2px; }
  .pslot .ghost { opacity: .28; filter: grayscale(1); }
  .pl { font-size: 11px; color: var(--dim); }
  .paper-hero { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .tip { margin-top: 12px; border: 2px solid var(--rc, var(--line)); border-radius: 12px; background: var(--panel2); padding: 12px; }
  .tip.empty { border-style: dashed; --rc: var(--line); }
  .tip-top { display: flex; align-items: center; gap: 12px; }
  .tip-emoji { font-size: 34px; line-height: 1; }
  .tip-main { flex: 1; min-width: 0; }
